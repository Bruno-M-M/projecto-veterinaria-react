<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Usuario - Administrador - Veterinaria San Marcos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="admin.css">
  <script src="../js/regiones-data.js" defer></script>
  <script src="../js/usuarios-data.js" defer></script>
  <script src="../js/usuarios-storage.js" defer></script>
  <script src="../js/nuevoUsuario.js" defer></script>
</head>
<body>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="logo">Veterinaria San Marcos</div>
      <nav>
        <ul>
          <li><a href="index.html">Panel principal</a></li>
          <li><a href="productos.html">Productos</a></li>
          <li><a href="usuarios.html">Usuarios</a></li>
        </ul>
      </nav>
    </aside>

    <main class="admin-content">
      <h1>Nuevo Usuario</h1>

      <form id="formulario-registro" class="form-producto" novalidate>
        <div class="campo">
          <label for="nombreRegistro">Nombre completo</label>
          <input type="text" id="nombreRegistro" placeholder="Ingrese su nombre">
        </div>

        <div class="campo">
          <label for="runRegistro">RUN (sin puntos ni guión)</label>
          <input type="text" id="runRegistro" placeholder="12345678K" maxlength="9">
        </div>

        <div class="campo">
          <label for="correoRegistro">Correo Electrónico</label>
          <input type="email" id="correoRegistro" placeholder="nombre@duoc.cl" maxlength="100">
        </div>

        <div class="campo">
          <label for="correoConfirmar">Confirmar Correo Electrónico</label>
          <input type="email" id="correoConfirmar" placeholder="nombre@duoc.cl" maxlength="100">
        </div>

        <div class="campo">
          <label for="regionRegistro">Región</label>
          <select id="regionRegistro">
            <option value="" disabled selected>Seleccione una región</option>
          </select>
        </div>

        <div class="campo">
          <label for="comunaRegistro">Comuna</label>
          <select id="comunaRegistro" disabled>
            <option value="" disabled selected>Seleccione primero una región</option>
          </select>
        </div>

        <div class="campo">
          <label for="tipoUsuario">Tipo de Usuario</label>
          <select id="tipoUsuario">
            <option value="" disabled selected>Seleccione un tipo de usuario</option>
            <option value="Administrador">Administrador</option>
            <option value="Cliente">Cliente</option>
            <option value="Vendedor">Vendedor</option>
          </select>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="Contraseña">
        </div>

        <div class="campo">
          <label for="passwordConfirmar">Confirmar Contraseña</label>
          <input type="password" id="passwordConfirmar" placeholder="Contraseña">
        </div>

        <div id="mensaje-resultado" class="mt-2"></div>

        <div class="form-acciones">
          <a href="usuarios.html" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-success">Crear Usuario</button>
        </div>
      </form>
    </main>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
