<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrador - Veterinaria San Marcos</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="admin.css">
  <script src="../js/productos-data.js" defer></script>
  <script src="../js/productos-storage.js" defer></script>
  <script src="../js/usuarios-data.js" defer></script>
  <script src="../js/usuarios-storage.js" defer></script>
  <script src="../js/admin-dashboard.js" defer></script>
  
</head>
<body>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="logo">Veterinaria San Marcos</div>
      <nav>
        <ul>
          <li><a href="index.html">Panel principal</a></li>
          <li><a href="productos.html">Productos</a></li>
          <li><a href="usuarios.html">Usuarios</a></li>
        </ul>
      </nav>
    </aside>

    <main class="admin-content">
      <h1>¡Hola Administrador!</h1>
      <p>Resumen general del sistema.</p>

      <section class="grid-container">
        <div class="stat-card">
          <span class="stat-label">Productos: </span>
          <span class="stat-valor" id="stat-productos">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Usuarios: </span>
          <span class="stat-valor" id="stat-usuarios">—</span>
        </div>
        <div class="stat-card stat-alerta">
          <span class="stat-label">Stock bajo: </span>
          <span class="stat-valor" id="stat-stock-bajo">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Vendedores: </span>
          <span class="stat-valor" id="stat-vendedores">—</span>
        </div>
      </section>

      <div class="dashboard-columnas">
        <div class="panel-caja">
          <h2 class="servicios-nombre">Alertas de stock</h2>
          <ul class="list-group" id="lista-stock-bajo">
            <li class="list-group-item text-muted">Cargando...</li>
          </ul>
        </div>
        <div class="panel-caja">
          <h2  class="servicios-nombre">Usuarios por tipo</h2>
          <ul class="list-group">
            <li class="list-group-item d-flex justify-content-between align-items-center">
              Administradores <strong id="stat-admins">—</strong>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              Vendedores <strong id="stat-vendedores-2">—</strong>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              Clientes <strong id="stat-clientes">—</strong>
            </li>
          </ul>
        </div>
        
      </div>
    </main>
  </div>

</body>
</html>
