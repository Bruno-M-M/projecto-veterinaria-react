<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Producto - Administrador - Veterinaria San Marcos</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  
  <link rel="stylesheet" href="../css/style.css">
  
  <link rel="stylesheet" href="admin.css">
  
  <script src="../js/productos-data.js" defer></script>
  <script src="../js/productos-storage.js" defer></script>

  <script src="../js/producto-form.js" defer></script>
</head>
<body>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="logo">Veterinaria San Marcos</div>
      <nav>
        <ul>
          <li><a href="index.html">Panel principal</a></li>
          <li><a href="productos.html">Productos</a></li>
          <li><a href="usuarios.html">Usuarios</a></li>
        </ul>
      </nav>
    </aside>

    <main class="admin-content">
      <h1 id="form-titulo">Nuevo Producto</h1>

      <form id="form-producto" class="form-producto" novalidate>
        <div class="campo">
          <label for="campo-codigo">Código</label>
          <input type="text" id="campo-codigo" name="codigo">
          <p class="campo-error" id="error-codigo"></p>
        </div>

        <div class="campo">
          <label for="campo-nombre">Nombre</label>
          <input type="text" id="campo-nombre" name="nombre">
          <p class="campo-error" id="error-nombre"></p>
        </div>

        <div class="campo">
          <label for="campo-descripcion">Descripción (opcional)</label>
          <textarea id="campo-descripcion" name="descripcion" rows="3"></textarea>
          <p class="campo-error" id="error-descripcion"></p>
        </div>

        <div class="campo">
          <label for="campo-precio">Precio</label>
          <input type="number" id="campo-precio" name="precio" step="10">
          <p class="campo-error" id="error-precio"></p>
        </div>

        <div class="campo">
          <label for="campo-stock">Stock</label>
          <input type="number" id="campo-stock" name="stock" step="1">
          <p class="campo-error" id="error-stock"></p>
        </div>

        <div class="campo">
          <label for="campo-stock-critico">Stock Crítico (opcional)</label>
          <input type="number" id="campo-stock-critico" name="stockCritico" step="1">
          <p class="campo-error" id="error-stock-critico"></p>
        </div>

        <div class="campo">
          <label for="campo-categoria">Categoría</label>
          <select id="campo-categoria" name="categoria">
            <option value="">Seleccione una categoría</option>
            <option value="antibioticos">Antibióticos</option>
            <option value="antiparasitarios">Antiparasitarios</option>
            <option value="antiinflamatorios">Antiinflamatorios</option>
            <option value="dermatologia">Dermatología</option>
            <option value="digestivo">Digestivo</option>
            <option value="cardiaco">Cardíaco</option>
            <option value="analgesicos">Analgésicos</option>
            <option value="vacunas">Vacunas</option>
            <option value="suplementos">Suplementos</option>
          </select>
          <p class="campo-error" id="error-categoria"></p>
        </div>

        <div class="campo">
          <label for="campo-imagen">Imagen (opcional)</label>
          <input type="file" id="campo-imagen" name="imagen" accept="image/*">
        </div>

        <p id="form-mensaje" class="form-mensaje" hidden></p>

        <div class="form-acciones">
          <a href="productos.html" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-success" id="btn-guardar">Crear Producto</button>
        </div>
      </form>
    </main>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
