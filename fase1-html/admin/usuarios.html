<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios - Administrador - Veterinaria San Marcos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="admin.css">
  <script src="../js/regiones-data.js" defer></script>
  <script src="../js/usuarios-data.js" defer></script>
  <script src="../js/usuarios-storage.js" defer></script>
  <script src="../js/usuarios.js" defer></script>
</head>
<body>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="logo">Veterinaria San Marcos</div>
      <nav>
        <ul>
          <li><a href="index.html">Panel principal</a></li>
          <li><a href="productos.html">Productos</a></li>
          <li><a href="usuarios.html">Usuarios</a></li>
        </ul>
      </nav>
    </aside>

    <main class="admin-content">
      <div class="admin-content-header">
        <h1>Usuarios</h1>
        <a href="nuevousuario.html" class="btn btn-success">+ Nuevo Usuario</a>
      </div>

      <div class="mb-3">
        <input type="text" id="buscar-usuario" class="admin-search" placeholder="Buscar por nombre, RUN, correo, región, comuna...">
      </div>

      <div class="admin-tabla-wrap">
        <table class="admin-tabla">
          <thead>
            <tr>
              <th scope="col">Nombre</th>
              <th scope="col">RUN</th>
              <th scope="col">Correo</th>
              <th scope="col">Región</th>
              <th scope="col">Comuna</th>
              <th scope="col">Tipo</th>
              <th scope="col"></th>
            </tr>
          </thead>
          <tbody id="admin-usuarios-items">

          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modalEditar">
    <div class="modal-contenido">
      <div class="modal-header">
        <h3>Editar Usuario</h3>
        <button type="button" class="modal-cerrar" id="btnCerrarModal" aria-label="Cerrar">&times;</button>
      </div>
      <form id="formEditarUsuario" class="form-producto" style="padding: 0; border: none;">
        <input type="hidden" id="editUserIndex">

        <div class="campo">
          <label for="editNombre">Nombre Completo</label>
          <input type="text" id="editNombre" required>
        </div>

        <div class="campo">
          <label for="editRun">RUN</label>
          <input type="text" id="editRun" required maxlength="9">
        </div>

        <div class="campo">
          <label for="editCorreo">Correo Electrónico</label>
          <input type="email" id="editCorreo" required>
        </div>

        <div class="campo">
          <label for="editRegion">Región</label>
          <select id="editRegion" required></select>
        </div>

        <div class="campo">
          <label for="editComuna">Comuna</label>
          <select id="editComuna" required></select>
        </div>

        <div class="campo">
          <label for="editTipo">Tipo de Usuario</label>
          <select id="editTipo" required>
            <option value="Administrador">Administrador</option>
            <option value="Cliente">Cliente</option>
            <option value="Vendedor">Vendedor</option>
          </select>
        </div>

        <div class="form-acciones">
          <button type="button" class="btn btn-outline-secondary" id="btnCancelarEditar">Cancelar</button>
          <button type="submit" class="btn btn-success">Guardar Cambios</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/main.js"></script>
</body>
</html>
